apiVersion: 1

providers:
  - name: nxtflow
    orgId: 1
    folder: Networking
    folderUid: nxtflow-networking
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false

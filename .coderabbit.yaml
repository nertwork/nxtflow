# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
early_access: true
enable_free_tier: true

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  review_status: true
  review_details: true
  collapse_walkthrough: false
  changed_files_summary: true
  sequence_diagrams: true
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: true
  auto_apply_labels: true
  poem: true

  labeling_instructions:
    - label: "bug"
      instructions: "Apply when the PR fixes a crash, race condition, memory leak, or LogQL/PromQL bug."
    - label: "enhancement"
      instructions: "Apply when the PR introduces a new feature, CLI flag, or MCP tool."
    - label: "helm"
      instructions: "Apply when files under charts/nxtflow/ or examples/values-*.yaml are modified."
    - label: "security"
      instructions: "Apply when TLS verification, auth Secret handling, or security audit rules are modified."
    - label: "documentation"
      instructions: "Apply when README.md, CHANGELOG.md, CONTRIBUTING.md, or docs/** are modified."
    - label: "ci/cd"
      instructions: "Apply when .github/workflows/**, .coderabbit.yaml, ct.yaml, or .github/dependabot.yml are modified."

  path_instructions:
    - path: "src/**/*.py"
      instructions: |
        Review Python 3.11+ code for:
        1. Strict LogQL injection safety (escape_logql_label / sanitize_logql_regex) and bounded query limits.
        2. Non-blocking health/readiness endpoints and bounded ring-buffer/cache memory usage.
        3. Zero hardcoded internal IP addresses, private hostnames, or credentials.
    - path: "charts/nxtflow/**"
      instructions: |
        Review Helm chart templates and values for:
        1. Dual-mode compatibility (tags.standalone=true vs tags.standalone=false with loki.externalUrl).
        2. Exact YAML key alignment with src/nxtflow/enricher/app.py.
        3. Non-root security contexts (fsGroup 65533 for goflow2/enricher, 65532 for mcp) and safe default configurations.
    - path: "tests/**/*.py"
      instructions: |
        Ensure tests are deterministic, offline-safe, and use only RFC 5737 / RFC 1918 / RFC 2606 fixtures.

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"

  tools:
    ruff:
      enabled: true
    yamllint:
      enabled: true
    actionlint:
      enabled: true
    gitleaks:
      enabled: true
    markdownlint:
      enabled: true

chat:
  auto_reply: true

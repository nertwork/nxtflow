name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build Containers, Helm OCI & GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Zero-PII Audit
        run: python3 scripts/zero_pii_audit.py

      - name: Determine Release Version
        id: vars
        run: |
          if [ -n "${GITHUB_REF_NAME}" ] && [[ "${GITHUB_REF_NAME}" == v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "Releasing nxtflow v${VER}"

      - name: Setup QEMU & Docker Buildx
        uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Multi-Arch Enricher Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.enricher
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/nertwork/nxtflow-enricher:v${{ steps.vars.outputs.version }}
            ghcr.io/nertwork/nxtflow-enricher:latest

      - name: Build & Push Multi-Arch MCP Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.mcp
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/nertwork/nxtflow-mcp:v${{ steps.vars.outputs.version }}
            ghcr.io/nertwork/nxtflow-mcp:latest

      - name: Setup Helm v4
        uses: azure/setup-helm@v4
        with:
          version: "v4.3.1"

      - name: Package & Push Helm Chart to GHCR OCI
        run: |
          VER="${{ steps.vars.outputs.version }}"
          helm repo add grafana-community https://grafana-community.github.io/helm-charts
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update
          helm dependency build charts/nxtflow
          mkdir -p dist
          helm package charts/nxtflow --version "${VER}" --app-version "${VER}" -d dist/
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "dist/nxtflow-${VER}.tgz" oci://ghcr.io/nertwork/charts

      - name: Build Python sdist & wheel
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip build
          python -m build --outdir dist/
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*
          generate_release_notes: true

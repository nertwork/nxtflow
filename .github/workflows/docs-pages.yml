name: Documentation Pages

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "assets/**"
      - "charts/nxtflow/README.md"
      - "pyproject.toml"
      - "README.md"
      - "CHANGELOG.md"
      - "skills/**"
      - ".github/workflows/docs-pages.yml"
      - ".github/scripts/sync_gh_pages.py"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Markdown Dependency
        run: python -m pip install --upgrade pip markdown

      - name: Build Static Site (_site)
        run: python3 .github/scripts/sync_gh_pages.py _site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

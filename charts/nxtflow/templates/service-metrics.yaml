apiVersion: v1
kind: Service
metadata:
  name: {{ include "nxtflow.fullname" . }}-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nxtflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: collector
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: {{ .Values.collector.metricsService.enricherPort | quote }}
    prometheus.io/path: "/metrics"
    {{- with .Values.collector.metricsService.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  type: {{ .Values.collector.metricsService.type }}
  selector:
    {{- include "nxtflow.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: collector
  ports:
    - name: enricher-metrics
      port: {{ .Values.collector.metricsService.enricherPort }}
      targetPort: metrics
      protocol: TCP
    - name: goflow2-metrics
      port: {{ .Values.collector.metricsService.goflow2Port }}
      targetPort: goflow2-metrics
      protocol: TCP

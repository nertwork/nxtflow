apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "nxtflow.fullname" . }}-test-connection"
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nxtflow.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: curl-test
      image: curlimages/curl:8.10.1
      command:
        - sh
        - -ec
        - |
          curl -fsS "http://{{ include "nxtflow.fullname" . }}-metrics:{{ .Values.collector.metricsService.enricherPort }}/healthz"
          curl -fsS "http://{{ include "nxtflow.fullname" . }}-metrics:{{ .Values.collector.metricsService.enricherPort }}/metrics" | grep -q "nxtflow_"
          {{- if .Values.mcp.enabled }}
          curl -fsS "http://{{ include "nxtflow.fullname" . }}-mcp:{{ .Values.mcp.service.port }}/healthz"
          {{- end }}

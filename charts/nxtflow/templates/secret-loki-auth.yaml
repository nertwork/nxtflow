{{- include "nxtflow.validateConfig" . -}}
{{- if include "nxtflow.hasInlineLokiAuth" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nxtflow.fullname" . }}-loki-auth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nxtflow.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.externalLoki.auth.username }}
  username: {{ .Values.externalLoki.auth.username | quote }}
  {{- end }}
  {{- if .Values.externalLoki.auth.password }}
  password: {{ .Values.externalLoki.auth.password | quote }}
  {{- end }}
  {{- if .Values.externalLoki.auth.bearerToken }}
  bearerToken: {{ .Values.externalLoki.auth.bearerToken | quote }}
  {{- end }}
{{- end }}

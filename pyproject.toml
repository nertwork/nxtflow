[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nxtflow"
version = "0.1.0"
description = "AI-ready multi-site NetFlow v5/v9, IPFIX, and sFlow collector, enricher, Loki pipeline, CLI, and MCP server"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "pyyaml>=6.0",
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.20,<3",
]
all = [
    "mcp>=1.20,<3",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
nxtflow = "nxtflow.cli:main"
nxtflow-mcp = "nxtflow.mcp_server:main"
nxtflow-enricher = "nxtflow.enricher.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
